name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Compile and assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Installs Gradle directly, so this build works even before
      # gradle-wrapper.jar has been committed to the repo.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      # Produces gradlew / gradlew.bat / gradle-wrapper.jar, which get
      # uploaded below so they can be committed once and reused forever.
      - name: Generate the Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Run Android Lint
        if: always()
        run: gradle lintDebug --no-daemon

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload the generated Gradle wrapper
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gradle-wrapper
          path: |
            gradle/wrapper/gradle-wrapper.jar
            gradlew
            gradlew.bat
          if-no-files-found: warn

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
